name: Uppdatera nyheter

on:
  schedule:
    - cron: "17 * * * *"   # varje timme, 17 minuter över (UTC)
  workflow_dispatch:        # gör att du kan köra den manuellt under fliken Actions
    inputs:
      nytt_quiz:
        description: "Skapa om veckans nyhetsquiz"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hämta nyheter
        run: node scripts/fetch-news.mjs
        continue-on-error: true   # sajten publiceras ändå med förra nyheterna

      - name: Typsnitt till quizets PDF
        run: sudo apt-get install -y -qq fonts-inter >/dev/null 2>&1 || echo "Kunde inte installera Inter, använder standardtypsnitt."

      - name: Skapa veckans nyhetsquiz (måndagar)
        run: node scripts/make-quiz.mjs
        continue-on-error: true   # ett misslyckat quiz ska inte stoppa nyheterna
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_QUIZ: ${{ inputs.nytt_quiz && '1' || '0' }}

      - name: Spara ändringar i repot
        run: |
          git config user.name "nyhetsroboten"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ -d quiz ]; then git add quiz; fi
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatering $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q origin main || true
            git push
          fi

      - name: Packa sajten
        run: |
          mkdir _site
          cp -r index.html quiz.html about.html og-bild.png sitemap.xml style.css app.js quiz-render.js data _site/
          if [ -d quiz ]; then cp -r quiz _site/; fi
          # Nytt versionsnummer på js/css vid varje publicering, så att webbläsare inte visar gammal kod
          sed -i -E "s/\?v=[0-9a-z]+/?v=${GITHUB_SHA::7}/g" _site/index.html _site/quiz.html _site/about.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
